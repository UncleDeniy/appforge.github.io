      </div>
    </div>
<div class="main"><section class="section"><h1>Версии ОС</h1></section>
<div class="section">
  <div class="filters" id="filters"></div>
  <div><button class="button" onclick="document.getElementById('filtersDrawer').classList.toggle('open')">Фильтры</button></div>
</div>
<div class="drawer" id="filtersDrawer">
  <div class="meta">Категория</div>
  <div id="chips"></div>
  <div class="meta" style="margin-top:8px">Сортировка</div>
  <select id="fsort">
    <option value="date_desc">Сначала новые</option>
    <option value="date_asc">Сначала старые</option>
    <option value="title_asc">A–Z</option>
    <option value="title_desc">Z–A</option>
  </select>
  <div style="margin-top:8px"><button class="button" onclick="run()">Применить</button></div>
</div>
<div class="grid" id="list"></div>
<script>
async function run(){
  const data = await Site.loadJSON('data/os.json');
  const sel = [...document.querySelectorAll('#chips .button.active')].map(b=>b.textContent);
  const sort = document.getElementById('fsort').value;
  let items = data.items.filter(i => sel.length===0 || sel.some(s => (i.categories||[]).includes(s)));
  if(sort==='date_asc') items.sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  if(sort==='date_desc') items.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  if(sort==='title_asc') items.sort((a,b)=> a.title.localeCompare(b.title));
  if(sort==='title_desc') items.sort((a,b)=> b.title.localeCompare(a.title));
  document.getElementById('list').innerHTML = items.map(Site.card).join('') || `<div class="card">${I18N.t('nothing','Ничего не найдено')}</div>`;
}
(async()=>{
  const data = await Site.loadJSON('data/os.json');
  const cats = [...new Set(data.items.flatMap(i=>i.categories||[]))];
  const box = document.getElementById('chips');
  box.innerHTML = cats.map(c=>`<button class="button" data-chip>${c}</button>`).join('');
  box.addEventListener('click', (e)=>{ const b=e.target.closest('[data-chip]'); if(!b) return; b.classList.toggle('active'); });
  run();
})();
</script>
</div>
    <div class="footer">© <span id="y"></span> AppForge</div>
  </div>
</div>
<div id="lightbox" class="lightbox" onclick="this.classList.remove('open')"><img alt=""/></div>
<script src="assets/js/app.js"></script>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
