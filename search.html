<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>AppForge</title>
  <meta property="og:title" content="AppForge — каталог софта"/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="assets/img/og.png"/>
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="layout" id="app">
  <aside class="sidebar">
    <div class="logo"><img src="assets/img/favicon.svg" alt="" /><div>AppForge</div></div>
    <nav class="sidenav">
      <a href="index.html" data-i18n="nav_home">🏠 Главная</a>
      <a href="apps.html" data-i18n="nav_apps">💻 Программы</a>
      <a href="extensions.html" data-i18n="nav_ext">🧩 Расширения</a>
      <a href="os.html" data-i18n="nav_os">🖥 Версии ОС</a>
      <a href="articles.html" data-i18n="nav_articles">📰 Статьи</a>
      <a href="products.html" data-i18n="nav_products">🛒 Товары</a>
      <small data-i18n="nav_note">Избранное доступно без регистрации</small>
    </nav>
    <div class="sidebar-footer">
      <a href="dmca.html">DMCA</a> ·
      <a href="privacy.html" data-i18n="privacy">Конфиденциальность</a> ·
      <a href="faq.html">FAQ</a> ·
      <a href="contacts.html" data-i18n="contacts">Контакты</a>
    </div>
  </aside>
  <div>
    <div class="header">
      <form class="search" onsubmit="return Site.searchRedirect(event)">
        <input class="input" id="q" placeholder="Поиск по сайту" data-i18n-placeholder="search_placeholder"/>
        <div id="ac" class="autocomplete" role="listbox"></div>
        <button aria-label="Search">🔎</button>
      </form>
      <div class="controls">
        <div class="select"><select id="langToggle"><option value="ru">RU</option><option value="en">EN</option></select></div>
        <a class="button" href="favorites.html" data-i18n="favorites">★ Избранное</a>
      </div>
    </div>
<div class="main"><section class="section"><h1>Поиск</h1></section><div class="grid" id="results"></div><script>(async()=>{const q=new URLSearchParams(location.search).get("q")||""; const all=(await Site.loadJSON("data/all.json")).items; const res=all.filter(i=>i.title.toLowerCase().includes(q.toLowerCase()) || (i.categories||[]).join(" ").toLowerCase().includes(q.toLowerCase())); document.getElementById("results").innerHTML=res.map(Site.card).join("")||`<div class="card">${I18N.t("nothing","Ничего не найдено")}</div>`;})();</script></div>
    <div class="footer">© <span id="y"></span> AppForge</div>
  </div>
</div>
<div id="lightbox" class="lightbox" onclick="this.classList.remove('open')"><img alt=""/></div>
<script src="assets/js/app.js"></script>
<script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
